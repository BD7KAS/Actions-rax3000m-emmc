name: Build ImmortalWrt-mt798x

# 正确的权限设置
permissions:
  contents: write
  actions: write
  packages: write

on:
  workflow_dispatch:
    inputs:
      USE_MTWIFI_CFG:
        description: 'Use mtwifi-cfg'
        required: true
        default: true
        type: boolean
      USE_NX30PRO_EEPROM:
        description: 'Use nx30pro eeprom'
        required: true
        default: true
        type: boolean
      USE_52MHZ:
        description: 'Use 52MHz max-frequency'
        required: true
        default: false
        type: boolean

env:
  REPO_URL: https://github.com/hanwckf/immortalwrt-mt798x
  TZ: Asia/Shanghai
  # 添加设备标识
  DEVICE_NAME: mt7981-cmcc-rax3000m-emmc
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: false
  UPLOAD_RELEASE: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 检出仓库代码
      uses: actions/checkout@v4
      with:
        path: source

    - name: 初始化环境变量
      run: |
        echo "USE_MTWIFI_CFG=${{ github.event.inputs.USE_MTWIFI_CFG }}" >> $GITHUB_ENV
        echo "USE_NX30PRO_EEPROM=${{ github.event.inputs.USE_NX30PRO_EEPROM }}" >> $GITHUB_ENV
        echo "USE_52MHZ=${{ github.event.inputs.USE_52MHZ }}" >> $GITHUB_ENV
        echo "FILE_DATE=$(date +%Y%m%d_%H%M)" >> $GITHUB_ENV

    - name: 设置构建环境
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get update -y
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
          g++-multilib gettext git libncurses5-dev libssl-dev python3 python3-pip \
          python3-venv python3-setuptools rsync unzip zlib1g-dev file wget

    - name: 检查磁盘空间
      run: df -h

    - name: 克隆 ImmortalWrt 源码
      working-directory: /tmp
      run: |
        git clone $REPO_URL openwrt
        ln -sf /tmp/openwrt $GITHUB_WORKSPACE/openwrt

    - name: 设置 ccache 缓存
      uses: actions/cache@v3
      with:
        path: /tmp/openwrt/ccache
        key: ${{ runner.os }}-openwrt-ccache-${{ hashFiles('**/.config') }}
        restore-keys: |
          ${{ runner.os }}-openwrt-ccache-

    - name: 更新 feeds 和配置
      run: |
        cd /tmp/openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        
        # 复制自定义配置
        if [ -d "$GITHUB_WORKSPACE/source/files" ]; then
          cp -r $GITHUB_WORKSPACE/source/files /tmp/openwrt/
        fi
        
        if [ -f "$GITHUB_WORKSPACE/source/.config" ]; then
          cp $GITHUB_WORKSPACE/source/.config /tmp/openwrt/
        fi

    - name: 应用自定义补丁和配置
      working-directory: /tmp/openwrt
      run: |
        # 添加默认配置
        echo "CONFIG_TARGET_mediatek=y" >> .config
        echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
        echo "CONFIG_TARGET_mediatek_filogic_7981=y" >> .config
        echo "CONFIG_TARGET_mediatek_filogic_7981_DEVICE_cmcc_rax3000m-emmc=y" >> .config
        
        # 应用配置片段
        if [ -f "$GITHUB_WORKSPACE/source/configs/rax3000m-emmc_mtksdk.config" ]; then
          cat $GITHUB_WORKSPACE/source/configs/rax3000m-emmc_mtksdk.config >> .config
        fi

    - name: 配置无线界面（mtwifi-cfg）
      if: env.USE_MTWIFI_CFG == 'true'
      working-directory: /tmp/openwrt
      run: |
        sed -i 's/CONFIG_PACKAGE_luci-app-mtk=y/# CONFIG_PACKAGE_luci-app-mtk is not set/' .config
        sed -i 's/CONFIG_PACKAGE_luci-i18n-mtk-zh-cn=y/# CONFIG_PACKAGE_luci-i18n-mtk-zh-cn is not set/' .config
        echo "CONFIG_PACKAGE_luci-app-mtwifi-cfg=y" >> .config
        echo "CONFIG_PACKAGE_luci-i18n-mtwifi-cfg-zh-cn=y" >> .config
        echo "CONFIG_PACKAGE_mtwifi-cfg=y" >> .config

    - name: 配置 NX30 Pro EEPROM
      if: env.USE_NX30PRO_EEPROM == 'true'
      run: |
        mkdir -p /tmp/openwrt/target/linux/mediatek/mt7981/base-files/lib/firmware
        if [ -f "$GITHUB_WORKSPACE/source/eeprom/nx30pro_eeprom.bin" ]; then
          cp $GITHUB_WORKSPACE/source/eeprom/nx30pro_eeprom.bin \
            /tmp/openwrt/target/linux/mediatek/mt7981/base-files/lib/firmware/MT7981_iPAiLNA_EEPROM.bin
        fi

    - name: 配置 eMMC 频率 (52MHz)
      if: env.USE_52MHZ == 'true'
      working-directory: /tmp/openwrt
      run: |
        dts_file="target/linux/mediatek/files-5.4/arch/arm64/boot/dts/mediatek/mt7981-cmcc-rax3000m-emmc.dts"
        if [ -f "$dts_file" ]; then
          sed -i 's/max-frequency = <26000000>/max-frequency = <52000000>/' "$dts_file"
        fi

    - name: 下载软件包
      working-directory: /tmp/openwrt
      run: |
        make defconfig
        make download -j$(nproc)
        # 重新下载失败的文件
        make download V=s 2>&1 | grep -i "failed\|error" || true

    - name: 编译固件
      working-directory: /tmp/openwrt
      timeout-minutes: 120
      run: |
        echo "开始编译，使用 $(nproc) 个核心"
        make -j$(nproc) V=s 2>&1 | tee build.log
        
        # 检查编译结果
        if [ $? -eq 0 ] && [ -d bin/targets/mediatek/filogic ]; then
          echo "编译成功"
          echo "COMPILE_STATUS=success" >> $GITHUB_ENV
        else
          echo "编译失败"
          echo "COMPILE_STATUS=failed" >> $GITHUB_ENV
          exit 1
        fi

    - name: 准备发布文件
      if: env.COMPILE_STATUS == 'success'
      run: |
        # 查找固件文件
        FIRMWARE_DIR=$(find /tmp/openwrt/bin/targets -type d -name "*7981*" | head -1)
        echo "FIRMWARE_DIR=$FIRMWARE_DIR" >> $GITHUB_ENV
        
        # 复制固件到工作空间
        mkdir -p $GITHUB_WORKSPACE/firmware
        cp $FIRMWARE_DIR/*.bin $GITHUB_WORKSPACE/firmware/ 2>/dev/null || true
        cp $FIRMWARE_DIR/*.img $GITHUB_WORKSPACE/firmware/ 2>/dev/null || true
        cp $FIRMWARE_DIR/*.gz $GITHUB_WORKSPACE/firmware/ 2>/dev/null || true

    - name: 创建发布说明
      if: env.COMPILE_STATUS == 'success'
      run: |
        cat > $GITHUB_WORKSPACE/release.md << EOF
        # ImmortalWrt for CMCC RAX3000M (eMMC版本)
        
        ## 构建信息
        - 设备：CMCC RAX3000M (eMMC)
        - 芯片：MediaTek MT7981
        - 无线界面：${{ env.USE_MTWIFI_CFG == 'true' && 'mtwifi-cfg' || 'MTK SDK' }}
        - EEPROM：${{ env.USE_NX30PRO_EEPROM == 'true' && 'NX30 Pro 提取' || '默认' }}
        - eMMC频率：${{ env.USE_52MHZ == 'true' && '52MHz' || '26MHz' }}
        - 构建时间：$(date)
        
        ## 包含的软件包
        - 基础系统：ImmortalWrt
        - 管理界面：LuCI
        - 无线驱动：mtwifi
        
        ## 刷机说明
        1. 进入原厂系统uboot
        2. 选择对应的固件文件刷入
        3. 等待重启完成
        EOF

    - name: 上传固件到 Release
      if: env.COMPILE_STATUS == 'success' && env.UPLOAD_RELEASE == 'true'
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: build-${{ env.DEVICE_NAME }}-${{ env.FILE_DATE }}
        name: ImmortalWrt ${{ env.DEVICE_NAME }} ${{ env.FILE_DATE }}
        body_path: $GITHUB_WORKSPACE/release.md
        files: |
          ${{ github.workspace }}/firmware/*.bin
          ${{ github.workspace }}/firmware/*.img
          ${{ github.workspace }}/firmware/*.gz
        draft: false
        prerelease: false

    - name: 清理工作空间
      if: always()
      run: |
        sudo rm -rf /tmp/openwrt
        rm -rf $GITHUB_WORKSPACE/openwrt
